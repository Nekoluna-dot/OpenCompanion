[platform]
# 通讯平台插件名（对应 botapp/platform/ 下注册的适配器）。
# 目前内置: wechat（weilink 微信）。
name = wechat

[llmapi]
base_url = https://api.deepseek.com/responses
api_key = sk-REPLACE_ME
model = deepseek-v4-flash
thinking = true
reasoning_effort = high
# 是否使用系统代理（true=走代理，false=强制直连绕过代理，默认 false）
use_proxy = false
# 是否接收图片消息并送入 LLM 理解（true=接收，false=忽略图片，需模型支持图片输入）
enable_image = true
# 是否接收视频消息并送入 LLM 理解（true=接收，false=忽略视频，需模型支持视频输入，视频须 <50MB）
enable_video = true
# 文本清洗：发送前删除括号内神态/动作描写（中文（）与英文()）
clean_paren = true
# 是否把 \n\n 和 \n 视为气泡分隔符（true=每个换行拆成一条消息发送）
split_newline = true
  # 上下文压缩触发阈值（估算 token 数，1 字符≈1 token），超过后自动总结压缩
compact_token_limit = 250000

api_type = responses
search_enabled = false
[mcp]
# 是否启动 MCP 服务器（供 AI 编码助手等调用 weilink 工具）
enabled = true
# 传输方式：streamable-http / sse（不支持 stdio，stdout 被日志占用）
transport = streamable-http
host = 127.0.0.1
port = 8000
# HTTP 鉴权 Bearer token，留空则不鉴权
token = 
# 是否启用 weilink 内建账号管理工具（sessions/login/logout/rename_session/set_default），
# false = 默认禁用，仅暴露 recv/send/download/history；true = 全部启用
account_tools_enabled = false

[mcpsources]
# 额外接入的外部 MCP 工具源（可配置多个；LLM 调用时自动带上这些工具）。
# option 名 = namespace（工具名前缀，避免不同源重名冲突），值为：
#   - URL 字符串:  http://127.0.0.1:9000  （HTTP MCP 服务器）
#   - stdio 描述:  {"command": "python", "args": ["path/server.py"]}
# 接入失败只告警，不影响 weilink 内置工具。示例（默认全注释掉）：
# calc = http://127.0.0.1:9000
# data = {"command": "python", "args": ["C:/mcp/data_server.py"]}
userfilerecord = {"command": "runtime/python/python.exe", "args": ["MCP/userfile.py"], "capability": "archive"}
eventlog = {"command": "runtime/python/python.exe", "args": ["MCP/event_logger.py"], "capability": "event"}
#movie = {"command": "runtime/python/python.exe", "args": ["MCP/movieinfo-get-office.py"]}
#emoji = {"command": "runtime/python/python.exe", "args": ["MCP/emoji.py"]}
location = {"command": "runtime/python/python.exe", "args": ["MCP/get_location.py"]}
topic = {"command": "runtime/python/python.exe", "args": ["MCP/topic_interest.py"]}
weather = {"command": "runtime/python/python.exe", "args": ["MCP/weather.py"]}
# Ombre Brain 长期情感记忆：stdio 子进程（由 bot 拉起，随 bot 生命周期常驻）
ombre = {"command": "runtime/python/python.exe", "args": ["MCP/OB/src/server.py"], "capability": "memory", "warmup": "breath"}
#todo = {"command": "runtime/python/python.exe", "args": ["MCP/todo_list.py"]}
# B站（免登录）：搜索/热门/热搜词/排行榜
bili = {"command": "runtime/python/python.exe", "args": ["MCP/bilibilisearch/mcp_server.py"]}
# TTS 语音服务：独立 venv + Genie-TTS 模型，启动即常驻加载模型
#tts = {"command": "TTS/.venv/Scripts/python.exe", "args": ["TTS/tts_mcp.py"]}


[conversation]
# 是否持久化对话上下文（重启后自动加载，跨会话连续对话）
enabled = true
# 上下文存档目录
dir = conversation

[web]
# 网页展示每次 LLM 请求的原始上下文与响应
enabled = true
host = 127.0.0.1
port = 8080
# 内存中保留的最大记录条数
max_records = 50
