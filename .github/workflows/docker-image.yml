name: Build and publish Docker image

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # 公开镜像不得携带真实 API key：把 config.ini / MCP/OB/.env /
      # MCP/OB/config.yaml 中的真实 key 替换为占位符后构建。
      # 真实 key 由运行时挂载的配置文件提供（见 docker-compose.yml）。
      - name: Sanitize API keys for public image
        run: |
          sed -i -E 's/sk-[A-Za-z0-9]{20,}/sk-REPLACE_ME/g' \
            config.ini MCP/OB/.env MCP/OB/config.yaml

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/nekoluna-dot/opencompanion:latest
            ghcr.io/nekoluna-dot/opencompanion:${{ github.ref_name }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}